# .github/workflows/ci.yml
#
# Jobs (in dependency order):
#   format-check   → clang-format on every push/PR
#   build-and-test → CPU-fallback build + unit tests (ubuntu-latest, no GPU)
#   coverage       → lcov report uploaded to Codecov (main branch only)
#   static-analysis→ clang-tidy (main branch only)
#   gpu-tests      → integration tests on self-hosted GPU runner (PRs to main)
 
name: CI
 
on:
  push:
    branches: [main, dev, "feature/**", "fix/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
 
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
 
env:
  CUDA_VERSION: "12.4.1"
  CMAKE_BUILD_TYPE: Release
  CONAN_VERSION: "2.4.0"
 
jobs:
  # ── 1. Format check ───────────────────────────────────────────────────────
  format-check:
    name: "clang-format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-15
 
      - name: Check formatting
        run: |
          find src include tests \
            \( -name "*.cpp" -o -name "*.cu" \
            -o -name "*.hpp" -o -name "*.cuh" \) \
            | xargs clang-format-15 --dry-run --Werror
          echo "All files formatted correctly."
 
  # ── 2. Build + unit tests (no GPU) ───────────────────────────────────────
  build-and-test:
    name: "Build & unit tests (CPU fallback)"
    runs-on: ubuntu-latest
    needs: format-check
 
    container:
      image: nvcr.io/nvidia/cuda:${{ env.CUDA_VERSION }}-devel-ubuntu22.04
      options: --user root
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            cmake ninja-build git python3 python3-pip \
            libopenmpi-dev ccache
          pip3 install --no-cache-dir "conan==${{ env.CONAN_VERSION }}"
          conan profile detect --force
 
      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: conan-${{ runner.os }}-
 
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
 
      - name: Conan install
        run: |
          conan install . \
            --output-folder=build \
            --build=missing \
            --settings=build_type=${{ env.CMAKE_BUILD_TYPE }} \
          || echo "Conan skipped"
 
      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DSTENCIL_CPU_FALLBACK=ON \
            -DSTENCIL_BUILD_TESTS=ON \
            -DSTENCIL_BUILD_BENCHMARKS=ON \
            -DSTENCIL_ENABLE_MPI=OFF \
            -DSTENCIL_ENABLE_NCCL=OFF \
            -DCMAKE_CUDA_ARCHITECTURES="70;80;86" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
 
      - name: Build
        run: cmake --build build --parallel "$(nproc)"
 
      - name: Run unit tests
        run: |
          ctest --test-dir build \
            --output-on-failure \
            --label-regex "unit" \
            --parallel "$(nproc)" \
            --timeout 120 \
            --output-junit unit-results.xml
 
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.sha }}
          path: |
            unit-results.xml
            build/Testing/
 
      - name: Post test summary
        if: always()
        run: |
          echo "## Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f unit-results.xml ]; then
            python3 - << 'PYEOF'
          import xml.etree.ElementTree as ET, os
          tree = ET.parse('unit-results.xml')
          root = tree.getroot()
          ts = root.find('.//testsuite') or root
          total   = ts.get('tests', '?')
          failed  = ts.get('failures', '0')
          skipped = ts.get('skipped', '0')
          passed  = str(int(total or 0) - int(failed or 0) - int(skipped or 0))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"| ✅ Passed | ❌ Failed | ⏭️ Skipped | Total |\n")
              f.write(f"|----------|----------|-----------|-------|\n")
              f.write(f"| {passed} | {failed} | {skipped} | {total} |\n\n")
          PYEOF
          fi
 
  # ── 3. GPU integration tests (self-hosted runner) ─────────────────────────
  gpu-tests:
    name: "GPU integration tests"
    # Only run on PRs targeting main, or manually triggered.
    # Requires a self-hosted runner registered with labels: [self-hosted, gpu, cuda]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: [self-hosted, gpu, cuda]
    needs: build-and-test
    timeout-minutes: 30
 
    steps:
      - uses: actions/checkout@v4
 
      - name: GPU info
        run: nvidia-smi
 
      - name: Configure (real GPU build)
        run: |
          cmake -B build-gpu -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTENCIL_CPU_FALLBACK=OFF \
            -DSTENCIL_BUILD_TESTS=ON \
            -DSTENCIL_BUILD_BENCHMARKS=OFF
 
      - name: Build
        run: cmake --build build-gpu --parallel "$(nproc)"
 
      - name: Run GPU integration tests
        run: |
          ctest --test-dir build-gpu \
            --output-on-failure \
            --label-regex "gpu" \
            --timeout 300 \
            --output-junit gpu-results.xml
 
      - name: Upload GPU test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-test-results-${{ github.sha }}
          path: gpu-results.xml
 
      - name: Post GPU test summary
        if: always()
        run: |
          echo "## GPU Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          nvidia-smi --query-gpu=name,memory.total \
            --format=csv,noheader >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
 
  # ── 4. Coverage (main branch only) ───────────────────────────────────────
  coverage:
    name: "Coverage (lcov → Codecov)"
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
 
    container:
      image: nvcr.io/nvidia/cuda:${{ env.CUDA_VERSION }}-devel-ubuntu22.04
      options: --user root
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Install deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            cmake ninja-build git python3 python3-pip lcov
          pip3 install --no-cache-dir "conan==${{ env.CONAN_VERSION }}"
          conan profile detect --force
 
      - name: Configure (Debug + coverage)
        run: |
          cmake -B build-cov -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSTENCIL_CPU_FALLBACK=ON \
            -DSTENCIL_BUILD_TESTS=ON \
            -DSTENCIL_ENABLE_COVERAGE=ON \
            -DCMAKE_CUDA_ARCHITECTURES="80"
 
      - name: Build + test
        run: |
          cmake --build build-cov --parallel "$(nproc)"
          ctest --test-dir build-cov \
            --output-on-failure \
            --label-regex "unit"
 
      - name: Generate lcov report
        run: |
          lcov --capture --directory build-cov \
               --output-file coverage.info \
               --ignore-errors mismatch
          lcov --remove coverage.info \
               '*/googletest/*' '*/tests/*' '/usr/*' \
               --output-file coverage.info
          lcov --list coverage.info
 
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
 
  # ── 5. Static analysis (main branch only) ────────────────────────────────
  static-analysis:
    name: "clang-tidy"
    runs-on: ubuntu-latest
    needs: format-check
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
 
    container:
      image: nvcr.io/nvidia/cuda:${{ env.CUDA_VERSION }}-devel-ubuntu22.04
      options: --user root
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Install deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            cmake ninja-build clang-tidy-15 python3 python3-pip
          pip3 install --no-cache-dir "conan==${{ env.CONAN_VERSION }}"
          conan profile detect --force
 
      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTENCIL_CPU_FALLBACK=ON \
            -DSTENCIL_BUILD_TESTS=OFF \
            -DCMAKE_CUDA_ARCHITECTURES="80" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
 
      - name: Run clang-tidy
        run: |
          find src include \
            \( -name "*.cpp" -o -name "*.hpp" \) \
            | xargs clang-tidy-15 \
                -p build \
                --warnings-as-errors="*" \
                2>&1 | tee clang-tidy-report.txt
          echo "clang-tidy exit: $?"
 
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-${{ github.sha }}
          path: clang-tidy-report.txt