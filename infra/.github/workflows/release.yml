# .github/workflows/release.yml
# On version tags (v*): build release binaries, run full benchmarks,
# generate the performance report PDF, and create a GitHub Release.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  release:
    name: "Build & publish release"
    runs-on: [self-hosted, gpu, cuda]
    timeout-minutes: 90
    permissions:
      contents: write   # needed to create GitHub Release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install Python deps
        run: pip3 install --quiet matplotlib numpy pandas

      - name: Configure release build
        run: |
          cmake -B build-release -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTENCIL_CPU_FALLBACK=OFF \
            -DSTENCIL_BUILD_TESTS=ON \
            -DSTENCIL_BUILD_BENCHMARKS=ON \
            -DSTENCIL_ENABLE_NVTX=ON

      - name: Build
        run: cmake --build build-release --parallel "$(nproc)"

      - name: Run full test suite
        run: ctest --test-dir build-release --output-on-failure --parallel 4

      - name: Run benchmarks
        run: |
          mkdir -p release-results
          ./build-release/bin/bench/bench_naive  --nx 512 --ny 512 --nz 512 --steps 500 --output release-results/naive.json
          ./build-release/bin/bench/bench_tiled  --nx 512 --ny 512 --nz 512 --steps 500 --output release-results/tiled.json
          ./build-release/bin/bench/bench_scaling --output release-results/scaling.json

      - name: Generate performance report
        run: |
          python3 scripts/plot_results.py \
            --naive   release-results/naive.json \
            --tiled   release-results/tiled.json \
            --scaling release-results/scaling.json \
            --outdir  release-results/plots \
            --report  release-results/BENCHMARKS-${{ steps.version.outputs.VERSION }}.md

      - name: Package binaries
        run: |
          mkdir -p dist
          cp build-release/bin/stencil_naive  dist/
          cp build-release/bin/stencil_tiled  dist/
          tar czf stencil-solver-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "stencil-solver v${{ steps.version.outputs.VERSION }}"
          body_path: release-results/BENCHMARKS-${{ steps.version.outputs.VERSION }}.md
          files: |
            stencil-solver-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz
            release-results/naive.json
            release-results/tiled.json
            release-results/scaling.json
            release-results/plots/*.png
